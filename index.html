<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://player.restream.io">
    <link rel="preconnect" href="https://blogger.googleusercontent.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #player-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            z-index: 1;
        }
        
        .fullscreen-message {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        
        .loading-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1002;
            transition: opacity 0.5s;
        }
        
        .loading-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .loading-image.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        
        .loading-spinner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
            transition: opacity 0.5s;
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner.visible {
            opacity: 1;
            pointer-events: all;
        }
        
        .loading-spinner.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            color: white;
            font-size: 48px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        
    </style>
</head>
<body>
    
    <div class="loading-image" id="loadingImage">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiZmRslaovrVP07DAR3DXHelJJx1FOAqt_-LyC5mGL0rC6nw28ZMku-kZ9C1gfdd09gRI85vsKgpE19r50rwM3_2rtMn_qGQg6Wk1KEaQy1GYWxpLDoi-Qt9gCa_ToPpsFrwTLzVPCEaYg7V_-E79uUIoUlYNVccisZZq8So82F9iEy7SkDMI2ZGlbgq-h4/s320/Untitled%20design%20-%202025-09-20T011659.168.png" alt="Loading">
    </div>
    
    
    <div class="loading-spinner" id="loadingSpinner">
        <i class="fas fa-spinner spinner"></i>
    </div>
    
    <div id="player-container">
        <div class="fullscreen-message"></div>
        
        
        
        
        <iframe id="player-frame" 
                src="https://player.restream.io/?token=4f71cc555c994494b193a6da77542d72" 
                allow="autoplay; fullscreen"
                onload="onPlayerLoad()"></iframe>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const playerFrame = document.getElementById('player-frame');
            const loadingImage = document.getElementById('loadingImage');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            
            playerFrame.style.width = '100%';
            playerFrame.style.height = '100%';
            
           
            setTimeout(() => {
                loadingImage.classList.add('hidden');
                loadingSpinner.classList.add('visible');
                
                
                setTimeout(() => {
                    loadingSpinner.classList.remove('visible');
                    loadingSpinner.classList.add('hidden');
                }, 5000);
            }, 3000);
            
           
            function requestFullScreen() {
                const element = document.documentElement;
                
                if (element.requestFullscreen) {
                    element.requestFullscreen().catch(err => {
                        console.log('Fullscreen request failed:', err);
                    });
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                }
            }
            
           
            setTimeout(requestFullScreen, 1000);
            
           
            setTimeout(() => {
                const message = document.querySelector('.fullscreen-message');
                if (message) message.style.display = 'none';
            }, 3000);
        });
        
        
        function onPlayerLoad() {
            const loadingImage = document.getElementById('loadingImage');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            
            loadingImage.classList.add('hidden');
            loadingSpinner.classList.remove('visible');
            loadingSpinner.classList.add('hidden');
        }
    </script>
</body>
</html>
